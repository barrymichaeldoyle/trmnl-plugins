# TRMNL keeps these two settings encrypted and leaves them blank in its plugin
# archive, so GitHub Sync would erase them from src/settings.yml on every save
# made in TRMNL. They live here instead; the tooling merges them into the
# settings for previews, checks, the import ZIP and `pnpm upload`.
# Deploy with `pnpm upload`, never TRMNL's "Import latest" from GitHub, which
# would send the blanks and wipe the live request.
polling_headers: authorization=Bearer {{ oauth_access_token }}&content-type=application/json
# 93 days always covers this month and the two full months before it. TRMNL
# renders Liquid in UTC, so the end date runs one day ahead for time zones east
# of UTC; AdMob has no row for a date that has not started.
polling_body: |-
  {%- assign start = "now" | date: "%s" | minus: 8035200 -%}
  {%- assign end = "now" | date: "%s" | plus: 86400 -%}
  {"reportSpec":{"dateRange":{"startDate":{"year":{{ start | date: "%Y" }},"month":{{ start | date: "%-m" }},"day":{{ start | date: "%-d" }}},"endDate":{"year":{{ end | date: "%Y" }},"month":{{ end | date: "%-m" }},"day":{{ end | date: "%-d" }}}},"dimensions":["DATE"],"metrics":["ESTIMATED_EARNINGS"],"sortConditions":[{"dimension":"DATE","order":"ASCENDING"}],"maxReportRows":100}}
