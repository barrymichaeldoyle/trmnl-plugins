---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: post
framework_version: 3.4.0
serverless_language: node
refresh_interval_floor: '15'
polling_url: https://admob.googleapis.com/v1/accounts/{{ publisher_id }}/networkReport:generate
polling_headers: authorization=Bearer {{ oauth_access_token }}&content-type=application/json
polling_body: "{%- assign start = \"now\" | date: \"%s\" | minus: 8035200 -%}\r\n{%- assign end = \"now\" | date: \"%s\" | plus: 86400 -%}\r\n{\"reportSpec\":{\"dateRange\":{\"startDate\":{\"year\":{{ start | date: \"%Y\" }},\"month\":{{ start | date: \"%-m\" }},\"day\":{{ start | date: \"%-d\" }}},\"endDate\":{\"year\":{{ end | date: \"%Y\" }},\"month\":{{ end | date: \"%-m\" }},\"day\":{{ end | date: \"%-d\" }}}},\"dimensions\":[\"DATE\"],\"metrics\":[\"ESTIMATED_EARNINGS\",\"AD_REQUESTS\",\"IMPRESSIONS\",\"CLICKS\"],\"sortConditions\":[{\"dimension\":\"DATE\",\"order\":\"ASCENDING\"}],\"maxReportRows\":100}}"
id: 499993
oauth_enabled: 'true'
oauth_pkce_enabled: 'no'
oauth_authorize_url: https://accounts.google.com/o/oauth2/v2/auth
oauth_token_url: https://oauth2.googleapis.com/token
oauth_scopes: https://www.googleapis.com/auth/admob.report
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: '{"access_type":"offline","prompt":"consent"}'
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: publisher_id
  field_type: xhrSelect
  name: AdMob account
  optional: true
  description: Connect Google above, then choose the account to show.
  placeholder: pub-0000000000000000
  remote:
    url: https://admob.googleapis.com/v1/accounts
    method: GET
    headers:
      Authorization: Bearer {{ oauth_access_token }}
    response_path: account
    label_field: "{{ publisherId }} · {{ currencyCode }}"
    value_field: publisherId
- keyname: comparison_style
  field_type: select
  name: Comparison
  description: How each figure compares with its earlier period.
  options:
  - Percent change: percent
  - Amount change: amount
  - Both: both
  default: percent
- keyname: appearance
  field_type: select
  name: Appearance
  description: Dark shows light text on a black screen.
  options:
  - Light: light
  - Dark: dark
  default: light
- keyname: about
  field_type: author_bio
  name: About AdMob Earnings
  description: 'An independent TRMNL recipe for Google AdMob publishers. It reads estimated earnings with read-only access through your Google sign-in, which TRMNL stores and refreshes. Nothing is sent anywhere else. Not affiliated with or endorsed by Google.<br><br>AdMob Earnings puts your Google AdMob revenue on your TRMNL, so you can see how your apps are doing without opening the AdMob console or a phone app. Today&#39;s earnings so far take centre stage, with yesterday, this month so far and last month alongside. Each is compared with the period before it: yesterday with the same day last week, this month with the same day last month, and last month with the month before last. Choose percent change, amount change or both. Full screen also shows each figure&#39;s ad requests, impressions and clicks.<br><br>Amounts appear in your account&#39;s reporting currency and follow its reporting time zone, the same way the AdMob console counts a day. Sign in with Google and pick your AdMob account from a list. There is no API key to copy, and access is read-only. TRMNL stores and refreshes the sign-in; the recipe sends your data nowhere else. Full-screen and all three mashup layouts are included, in light or dark.'
  category: analytics,personal
  github_url: https://github.com/barrymichaeldoyle/trmnl-plugins
  learn_more_url: https://github.com/barrymichaeldoyle/trmnl-plugins/tree/main/apps/admob-earnings
name: AdMob Earnings
description: AdMob earnings at a glance
refresh_interval: 60
