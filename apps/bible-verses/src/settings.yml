strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.4.0
serverless_language: node
refresh_interval_floor: '60'
polling_url: https://cdn.jsdelivr.net/gh/barrymichaeldoyle/trmnl-plugins@main/apps/bible-verses/content/verses/{% case language %}{% when 'bsb', 'kjv', 'luther1912', 'rv1909', 'ntbt', 'lsg1910', 'riveduta1927', 'hs1917', 'blivre' %}{{ language }}{% when 'es' %}rv1909{% when 'fr' %}lsg1910{% else %}web{% endcase %}.json
polling_headers: ''
polling_body: ''
id: 494585
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: language
  field_type: select
  name: Bible translation
  description: Grouped by language. Every translation has the same 108 passages.
  description-fr: Classées par langue. Chaque traduction contient les mêmes 108 passages.
  description-es-ES: Agrupadas por idioma. Cada traducción tiene los mismos 108 pasajes.
  options:
  - English · World English Bible (WEB): web
  - English · Berean Standard Bible (BSB): bsb
  - English · King James Version (KJV): kjv
  - Deutsch · Lutherbibel 1912 (LUT1912): luther1912
  - Español · Reina Valera 1909 (RV1909): rv1909
  - Español · Nueva Traducción BibliaTodo (NTBT): ntbt
  - Français · Louis Segond 1910 (LSG1910): lsg1910
  - Italiano · Riveduta 1927 (RIV): riveduta1927
  - Nederlands · De Heilige Schrift 1917 (HS1917): hs1917
  - Português · Bíblia Livre (BLIVRE): blivre
  default: web
- keyname: theme
  field_type: select
  multiple: true
  optional: true
  name: Themes
  description: Leave empty for a mix of every theme.
  description-fr: Laissez vide pour alterner entre tous les thèmes.
  description-es-ES: Déjalo vacío para alternar entre todos los temas.
  options:
  - Family: family
  - Relationships: relationships
  - Work: work
  - Generosity: money
  - Decisions: decisions
  - Worry: rest
  - Loss: hardship
  - Gratitude: gratitude
  - Prayer: faith
- keyname: show_context_qr
  field_type: boolean
  name: Chapter QR code
  description: Scan to read the full chapter.
  description-fr: Scannez pour lire le chapitre complet.
  description-es-ES: Escanea para leer el capítulo completo.
  default: true
- keyname: appearance
  field_type: select
  name: Appearance
  description: Dark shows light text on a black screen.
  description-fr: Le mode sombre affiche un texte clair sur un écran noir.
  description-es-ES: El modo oscuro muestra texto claro sobre una pantalla negra.
  options:
  - Light: light
  - Dark: dark
  default: light
- keyname: about
  field_type: author_bio
  name: About Daily Bread
  description: 'An independent TRMNL Bible recipe. Scripture comes from the <a href="https://worldenglish.bible/" class="underline">World English Bible (WEB)</a>, <a href="https://ebible.org/bible/details.php?id=engbsb" class="underline">Berean Standard Bible (BSB)</a>, <a href="https://ebible.org/bible/details.php?id=eng-kjv" class="underline">King James Version (KJV)</a>, <a href="https://ebible.org/bible/details.php?id=deu1912" class="underline">Lutherbibel 1912</a>, <a href="https://ebible.org/bible/details.php?id=spaRV1909" class="underline">Reina Valera 1909</a>, <a href="https://ebible.org/bible/details.php?id=fraLSG" class="underline">Louis Segond 1910</a>, <a href="https://ebible.org/bible/details.php?id=ita1927" class="underline">Riveduta 1927</a>, <a href="https://ebible.org/bible/details.php?id=nld" class="underline">De Heilige Schrift 1917</a>, all public domain (the King James Version outside the United Kingdom). Santa Biblia, Nueva Traducción BibliaTodo (NTBT). Publicada por <a href="https://www.bibliatodo.com/ntbt/" class="underline">BibliaTodo Bible Society</a>, sello editorial de BibliaTodo LLC. <a href="https://ebible.org/bible/details.php?id=porbr2018" class="underline">Bíblia Livre (BLIVRE)</a>, Copyright © Diego Santos, Mario Sérgio e Marco Teles, <a href="https://creativecommons.org/licenses/by/4.0/deed.pt-br" class="underline">CC BY 4.0</a>. Each publisher''s wording and spelling are preserved; whitespace is normalized and footnote markers, headings and layout marks are omitted for display. Each chapter QR code opens the selected translation online.<br><br>Daily Bread brings daily Bible verses to your TRMNL, with one complete passage to carry into your day. Keep Scripture in view at home or at your desk, with a distinctive cross and space to read and reflect.<br><br>Explore the same 108 curated passages in ten translations across seven languages: English, German, Spanish, French, Italian, Dutch and Portuguese. Choose one or several of nine everyday themes, including family, relationships, work, generosity, decisions, worry, loss, gratitude and prayer. Leave all themes selected for a varied daily reading.<br><br>Daily Bread changes passages each day by default, following your TRMNL timezone. Set a faster refresh rate, down to hourly, for new passages more often. An optional QR code opens the full chapter in your chosen translation, helping you read each passage in context.<br><br>Daily Bread fetches only your chosen translation''s passages from its public GitHub repository, so you need no Bible API key or separate Bible subscription. Full-screen and all three mashup layouts are included.<br><br>Install Daily Bread, choose your translation, and start with a passage a day.'
  description-fr: 'Une recette biblique indépendante pour TRMNL. Les textes proviennent de dix traductions : World English Bible, Berean Standard Bible, King James Version, Lutherbibel 1912, Reina Valera 1909, Louis Segond 1910, Riveduta 1927 et De Heilige Schrift 1917, du domaine public (la King James hors du Royaume-Uni). Santa Biblia, Nueva Traducción BibliaTodo (NTBT). Publicada por <a href="https://www.bibliatodo.com/ntbt/" class="underline">BibliaTodo Bible Society</a>, sello editorial de BibliaTodo LLC. <a href="https://ebible.org/bible/details.php?id=porbr2018" class="underline">Bíblia Livre (BLIVRE)</a>, Copyright © Diego Santos, Mario Sérgio e Marco Teles, <a href="https://creativecommons.org/licenses/by/4.0/deed.pt-br" class="underline">CC BY 4.0</a>. Le texte et l’orthographe de chaque éditeur sont conservés ; les espaces sont normalisés et les appels de note, intertitres et marques de mise en page sont omis pour l’affichage. Le code QR ouvre le chapitre dans la traduction choisie.'
  description-es-ES: 'Una receta bíblica independiente para TRMNL. Los textos proceden de diez traducciones: World English Bible, Berean Standard Bible, King James Version, Lutherbibel 1912, Reina Valera 1909, Louis Segond 1910, Riveduta 1927 y De Heilige Schrift 1917, de dominio público (la King James fuera del Reino Unido). Santa Biblia, Nueva Traducción BibliaTodo (NTBT). Publicada por <a href="https://www.bibliatodo.com/ntbt/" class="underline">BibliaTodo Bible Society</a>, sello editorial de BibliaTodo LLC. <a href="https://ebible.org/bible/details.php?id=porbr2018" class="underline">Bíblia Livre (BLIVRE)</a>, Copyright © Diego Santos, Mario Sérgio e Marco Teles, <a href="https://creativecommons.org/licenses/by/4.0/deed.pt-br" class="underline">CC BY 4.0</a>. Se conservan el texto y la ortografía de cada editorial; se normalizan los espacios y se omiten las llamadas a notas, los títulos y las marcas de maquetación para su visualización. El código QR abre el capítulo en la traducción elegida.'
  category: life,personal
  github_url: https://github.com/barrymichaeldoyle/trmnl-plugins
  learn_more_url: https://ebible.org/
name: 'Daily Bread: Bible Verses'
description: Daily Bible verses in 7 languages
refresh_interval: 1440
