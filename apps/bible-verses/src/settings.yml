custom_fields:
- keyname: language
  field_type: select
  name: Language
  description: English uses the World English Bible, French uses Louis Segond 1910, and Spanish uses Reina Valera 1909.
  description-fr: L’anglais utilise la World English Bible, le français Louis Segond 1910 et l’espagnol Reina Valera 1909.
  description-es-ES: El inglés usa la World English Bible, el francés Louis Segond 1910 y el español Reina Valera 1909.
  options:
  - English: en
  - Français: fr
  - Español: es
  default: en
- keyname: theme
  field_type: select
  multiple: true
  optional: true
  name: Themes
  description: Leave empty for a mix of every theme.
  description-fr: Laissez vide pour alterner entre tous les thèmes.
  description-es-ES: Déjalo vacío para alternar entre todos los temas.
  options:
  - Family: family
  - Relationships: relationships
  - Work: work
  - Generosity: money
  - Decisions: decisions
  - Worry: rest
  - Loss: hardship
  - Gratitude: gratitude
  - Prayer: faith
- keyname: show_context_qr
  field_type: boolean
  name: Chapter QR code
  description: Scan to read the full chapter.
  description-fr: Scannez pour lire le chapitre complet.
  description-es-ES: Escanea para leer el capítulo completo.
  default: true
- keyname: appearance
  field_type: select
  name: Appearance
  description: Dark shows light text on a black screen.
  description-fr: Le mode sombre affiche un texte clair sur un écran noir.
  description-es-ES: El modo oscuro muestra texto claro sobre una pantalla negra.
  options:
  - Light: light
  - Dark: dark
  default: light
- keyname: about
  field_type: author_bio
  name: About Daily Bread
  description: 'An independent TRMNL Bible recipe. Scripture comes from the <a href="https://worldenglish.bible/" class="underline">World English Bible (WEB)</a>, <a href="https://ebible.org/bible/details.php?id=fraLSG" class="underline">Louis Segond 1910</a> and <a href="https://ebible.org/bible/details.php?id=spaRV1909" class="underline">Reina Valera 1909</a>. All three translations are public domain. Their original wording and spelling are preserved; whitespace is normalized and publisher footnote markers are omitted for display. Each chapter QR code opens the selected translation on eBible.org.<br><br>Daily Bread brings daily Bible verses to your TRMNL, with one complete passage to carry into your day. Keep Scripture in view at home or at your desk, with a distinctive cross and space to read and reflect.<br><br>Explore 108 curated passages in each of three languages: English, French and Spanish. Choose one or several of nine everyday themes, including family, relationships, work, generosity, decisions, worry, loss, gratitude and prayer. Leave all themes selected for a varied daily reading.<br><br>Daily Bread changes passages each day by default, following your TRMNL timezone. Set a faster refresh rate, down to hourly, for new passages more often. An optional QR code opens the full chapter in your chosen translation, helping you read each passage in context.<br><br>English uses the World English Bible, French uses Louis Segond 1910, and Spanish uses Reina Valera 1909. All three are public-domain translations, preserving the publisher&#39;s Scripture wording. The collection is included with the recipe, so you need no Bible API key or separate Bible subscription. Full-screen and all three mashup layouts are included.<br><br>Install Daily Bread, choose your language, and start with a passage a day.'
  description-fr: Une recette biblique indépendante pour TRMNL. Les textes proviennent de la World English Bible (WEB), de Louis Segond 1910 et de Reina Valera 1909, trois traductions du domaine public. Le texte et l’orthographe d’origine sont conservés ; les espaces sont normalisés et les appels de note de l’éditeur sont omis pour l’affichage. Le code QR ouvre le chapitre dans la traduction choisie sur eBible.org.
  description-es-ES: Una receta bíblica independiente para TRMNL. Los textos proceden de la World English Bible (WEB), Louis Segond 1910 y Reina Valera 1909, tres traducciones de dominio público. Se conservan el texto y la ortografía originales; se normalizan los espacios y se omiten las llamadas a notas del editor para su visualización. El código QR abre el capítulo en la traducción elegida en eBible.org.
  category: life,personal
  github_url: https://github.com/barrymichaeldoyle/trmnl-plugins
  learn_more_url: https://ebible.org/
name: 'Daily Bread: Bible Verses'
description: Daily Bible verses in 3 languages
refresh_interval: 1440
