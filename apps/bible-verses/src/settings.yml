static_data: '{"translation":{"name":"World English Bible","abbreviation":"WEB","language":"en","edition":"Updated, LORD (engwebp)","license":"Public domain","source":"https://ebible.org/engwebp/"},"provenance":{"imported_on":"2026-10-02","archive_sha256":"6111813850dd11f6e847ce560541accb27743b694c35f0db154ea1fc60470975"},"themes":[{"id":"family","name":"Family & home"},{"id":"relationships","name":"Relationships"},{"id":"work","name":"Work & purpose"},{"id":"money","name":"Money & generosity"},{"id":"decisions","name":"Decisions & direction"},{"id":"rest","name":"Worry & rest"},{"id":"hardship","name":"Hard times & loss"},{"id":"gratitude","name":"Joy & gratitude"},{"id":"faith","name":"Faith & prayer"}],"verses":[{"id":"pro-1-8-9","theme":"family","reference":"Proverbs 1:8–9","text":"My son, listen to your father’s instruction, and don’t forsake your mother’s teaching; for they will be a garland to grace your head, and chains around your neck.","source":"https://ebible.org/engwebp/PRO01.htm#V8"},{"id":"rom-13-8-10","theme":"relationships","reference":"Romans 13:8–10","text":"Owe no one anything, except to love one another; for he who loves his neighbor has fulfilled the law. For the commandments, “You shall not commit adultery,” “You shall not murder,” “You shall not steal,” “You shall not covet,” and whatever other commandments there are, are all summed up in this saying, namely, “You shall love your neighbor as yourself.” Love doesn’t harm a neighbor. Love therefore is the fulfillment of the law.","source":"https://ebible.org/engwebp/ROM13.htm#V8"},{"id":"pro-16-3","theme":"work","reference":"Proverbs 16:3","text":"Commit your deeds to the LORD, and your plans shall succeed.","source":"https://ebible.org/engwebp/PRO16.htm#V3"},{"id":"heb-13-5-6","theme":"money","reference":"Hebrews 13:5–6","text":"Be free from the love of money, content with such things as you have, for he has said, “I will in no way leave you, neither will I in any way forsake you.” So that with good courage we say, “The Lord is my helper. I will not fear. What can man do to me?”","source":"https://ebible.org/engwebp/HEB13.htm#V5"},{"id":"jas-1-5","theme":"decisions","reference":"James 1:5","text":"But if any of you lacks wisdom, let him ask of God, who gives to all liberally and without reproach, and it will be given to him.","source":"https://ebible.org/engwebp/JAS01.htm#V5"},{"id":"jhn-14-27","theme":"rest","reference":"John 14:27","text":"Peace I leave with you. My peace I give to you; not as the world gives, I give to you. Don’t let your heart be troubled, neither let it be fearful.","source":"https://ebible.org/engwebp/JHN14.htm#V27"},{"id":"psa-34-17-18","theme":"hardship","reference":"Psalm 34:17–18","text":"The righteous cry, and the LORD hears, and delivers them out of all their troubles. The LORD is near to those who have a broken heart, and saves those who have a crushed spirit.","source":"https://ebible.org/engwebp/PSA034.htm#V17"},{"id":"1th-5-16-18","theme":"gratitude","reference":"1 Thessalonians 5:16–18","text":"Always rejoice. Pray without ceasing. In everything give thanks, for this is the will of God in Christ Jesus toward you.","source":"https://ebible.org/engwebp/1TH05.htm#V16"},{"id":"heb-4-14-16","theme":"faith","reference":"Hebrews 4:14–16","text":"Having then a great high priest who has passed through the heavens, Jesus, the Son of God, let’s hold tightly to our confession. For we don’t have a high priest who can’t be touched with the feeling of our infirmities, but one who has been in all points tempted like we are, yet without sin. Let’s therefore draw near with boldness to the throne of grace, that we may receive mercy and may find grace for help in time of need.","source":"https://ebible.org/engwebp/HEB04.htm#V14"},{"id":"eph-6-1-3","theme":"family","reference":"Ephesians 6:1–3","text":"Children, obey your parents in the Lord, for this is right. “Honor your father and mother,” which is the first commandment with a promise: “that it may be well with you, and you may live long on the earth.”","source":"https://ebible.org/engwebp/EPH06.htm#V1"},{"id":"1co-13-4-7","theme":"relationships","reference":"1 Corinthians 13:4–7","text":"Love is patient and is kind. Love doesn’t envy. Love doesn’t brag, is not proud, doesn’t behave itself inappropriately, doesn’t seek its own way, is not provoked, takes no account of evil; doesn’t rejoice in unrighteousness, but rejoices with the truth; bears all things, believes all things, hopes all things, and endures all things.","source":"https://ebible.org/engwebp/1CO13.htm#V4"},{"id":"pro-14-23","theme":"work","reference":"Proverbs 14:23","text":"In all hard work there is profit, but the talk of the lips leads only to poverty.","source":"https://ebible.org/engwebp/PRO14.htm#V23"},{"id":"1ti-6-6-8","theme":"money","reference":"1 Timothy 6:6–8","text":"But godliness with contentment is great gain. For we brought nothing into the world, and we certainly can’t carry anything out. But having food and clothing, we will be content with that.","source":"https://ebible.org/engwebp/1TI06.htm#V6"},{"id":"psa-119-130","theme":"decisions","reference":"Psalm 119:130","text":"The entrance of your words gives light. It gives understanding to the simple.","source":"https://ebible.org/engwebp/PSA119.htm#V130"},{"id":"php-4-6-7","theme":"rest","reference":"Philippians 4:6–7","text":"In nothing be anxious, but in everything, by prayer and petition with thanksgiving, let your requests be made known to God. And the peace of God, which surpasses all understanding, will guard your hearts and your thoughts in Christ Jesus.","source":"https://ebible.org/engwebp/PHP04.htm#V6"},{"id":"lam-3-22-24","theme":"hardship","reference":"Lamentations 3:22–24","text":"It is because of the LORD’s loving kindnesses that we are not consumed, because his mercies don’t fail. They are new every morning. Great is your faithfulness. “The LORD is my portion,” says my soul. “Therefore I will hope in him.”","source":"https://ebible.org/engwebp/LAM03.htm#V22"},{"id":"psa-107-1","theme":"gratitude","reference":"Psalm 107:1","text":"Give thanks to the LORD, for he is good, for his loving kindness endures forever.","source":"https://ebible.org/engwebp/PSA107.htm#V1"},{"id":"psa-145-18-19","theme":"faith","reference":"Psalm 145:18–19","text":"The LORD is near to all those who call on him, to all who call on him in truth. He will fulfill the desire of those who fear him. He also will hear their cry, and will save them.","source":"https://ebible.org/engwebp/PSA145.htm#V18"},{"id":"eph-6-4","theme":"family","reference":"Ephesians 6:4","text":"You fathers, don’t provoke your children to wrath, but nurture them in the discipline and instruction of the Lord.","source":"https://ebible.org/engwebp/EPH06.htm#V4"},{"id":"eph-4-32","theme":"relationships","reference":"Ephesians 4:32","text":"And be kind to one another, tender hearted, forgiving each other, just as God also in Christ forgave you.","source":"https://ebible.org/engwebp/EPH04.htm#V32"},{"id":"col-3-23-24","theme":"work","reference":"Colossians 3:23–24","text":"And whatever you do, work heartily, as for the Lord and not for men, knowing that from the Lord you will receive the reward of the inheritance; for you serve the Lord Christ.","source":"https://ebible.org/engwebp/COL03.htm#V23"},{"id":"1ti-6-9-10","theme":"money","reference":"1 Timothy 6:9–10","text":"But those who are determined to be rich fall into a temptation, a snare, and many foolish and harmful lusts, such as drown men in ruin and destruction. For the love of money is a root of all kinds of evil. Some have been led astray from the faith in their greed, and have pierced themselves through with many sorrows.","source":"https://ebible.org/engwebp/1TI06.htm#V9"},{"id":"pro-3-5-6","theme":"decisions","reference":"Proverbs 3:5–6","text":"Trust in the LORD with all your heart, and don’t lean on your own understanding. In all your ways acknowledge him, and he will make your paths straight.","source":"https://ebible.org/engwebp/PRO03.htm#V5"},{"id":"isa-26-3-4","theme":"rest","reference":"Isaiah 26:3–4","text":"You will keep whoever’s mind is steadfast in perfect peace, because he trusts in you. Trust in the LORD forever; for in the LORD, the LORD, is an everlasting Rock.","source":"https://ebible.org/engwebp/ISA26.htm#V3"},{"id":"psa-42-11","theme":"hardship","reference":"Psalm 42:11","text":"Why are you in despair, my soul? Why are you disturbed within me? Hope in God! For I shall still praise him, the saving help of my countenance, and my God.","source":"https://ebible.org/engwebp/PSA042.htm#V11"},{"id":"col-3-17","theme":"gratitude","reference":"Colossians 3:17","text":"Whatever you do, in word or in deed, do all in the name of the Lord Jesus, giving thanks to God the Father through him.","source":"https://ebible.org/engwebp/COL03.htm#V17"},{"id":"eph-2-8-10","theme":"faith","reference":"Ephesians 2:8–10","text":"for by grace you have been saved through faith, and that not of yourselves; it is the gift of God, not of works, that no one would boast. For we are his workmanship, created in Christ Jesus for good works, which God prepared before that we would walk in them.","source":"https://ebible.org/engwebp/EPH02.htm#V8"},{"id":"gal-6-2","theme":"family","reference":"Galatians 6:2","text":"Bear one another’s burdens, and so fulfill the law of Christ.","source":"https://ebible.org/engwebp/GAL06.htm#V2"},{"id":"col-3-12-14","theme":"relationships","reference":"Colossians 3:12–14","text":"Put on therefore, as God’s chosen ones, holy and beloved, a heart of compassion, kindness, lowliness, humility, and perseverance; bearing with one another, and forgiving each other, if any man has a complaint against any; even as Christ forgave you, so you also do. Above all these things, walk in love, which is the bond of perfection.","source":"https://ebible.org/engwebp/COL03.htm#V12"},{"id":"pro-12-11","theme":"work","reference":"Proverbs 12:11","text":"He who tills his land shall have plenty of bread, but he who chases fantasies is void of understanding.","source":"https://ebible.org/engwebp/PRO12.htm#V11"},{"id":"1ti-6-17-19","theme":"money","reference":"1 Timothy 6:17–19","text":"Charge those who are rich in this present age that they not be arrogant, nor have their hope set on the uncertainty of riches, but on the living God, who richly provides us with everything to enjoy; that they do good, that they be rich in good works, that they be ready to distribute, willing to share; laying up in store for themselves a good foundation against the time to come, that they may lay hold of eternal life.","source":"https://ebible.org/engwebp/1TI06.htm#V17"},{"id":"pro-4-23","theme":"decisions","reference":"Proverbs 4:23","text":"Keep your heart with all diligence, for out of it is the wellspring of life.","source":"https://ebible.org/engwebp/PRO04.htm#V23"},{"id":"mat-11-28-30","theme":"rest","reference":"Matthew 11:28–30","text":"“Come to me, all you who labor and are heavily burdened, and I will give you rest. Take my yoke upon you and learn from me, for I am gentle and humble in heart; and you will find rest for your souls. For my yoke is easy, and my burden is light.”","source":"https://ebible.org/engwebp/MAT11.htm#V28"},{"id":"rom-5-3-5","theme":"hardship","reference":"Romans 5:3–5","text":"Not only this, but we also rejoice in our sufferings, knowing that suffering produces perseverance; and perseverance, proven character; and proven character, hope; and hope doesn’t disappoint us, because God’s love has been poured into our hearts through the Holy Spirit who was given to us.","source":"https://ebible.org/engwebp/ROM05.htm#V3"},{"id":"psa-118-24","theme":"gratitude","reference":"Psalm 118:24","text":"This is the day that the LORD has made. We will rejoice and be glad in it!","source":"https://ebible.org/engwebp/PSA118.htm#V24"},{"id":"col-4-2-4","theme":"faith","reference":"Colossians 4:2–4","text":"Continue steadfastly in prayer, watching in it with thanksgiving, praying together for us also, that God may open to us a door for the word, to speak the mystery of Christ, for which I am also in bonds, that I may reveal it as I ought to speak.","source":"https://ebible.org/engwebp/COL04.htm#V2"},{"id":"deu-6-4-7","theme":"family","reference":"Deuteronomy 6:4–7","text":"Hear, Israel: The LORD is our God. The LORD is one. You shall love the LORD your God with all your heart, with all your soul, and with all your might. These words, which I command you today, shall be on your heart; and you shall teach them diligently to your children, and shall talk of them when you sit in your house, and when you walk by the way, and when you lie down, and when you rise up.","source":"https://ebible.org/engwebp/DEU06.htm#V4"},{"id":"rom-12-9-13","theme":"relationships","reference":"Romans 12:9–13","text":"Let love be without hypocrisy. Abhor that which is evil. Cling to that which is good. In love of the brothers be tenderly affectionate to one another; in honor prefer one another, not lagging in diligence, fervent in spirit, serving the Lord, rejoicing in hope, enduring in troubles, continuing steadfastly in prayer, contributing to the needs of the saints, and given to hospitality.","source":"https://ebible.org/engwebp/ROM12.htm#V9"},{"id":"psa-90-16-17","theme":"work","reference":"Psalm 90:16–17","text":"Let your work appear to your servants, your glory to their children. Let the favor of the Lord our God be on us. Establish the work of our hands for us. Yes, establish the work of our hands.","source":"https://ebible.org/engwebp/PSA090.htm#V16"},{"id":"php-4-11-13","theme":"money","reference":"Philippians 4:11–13","text":"Not that I speak because of lack, for I have learned in whatever state I am, to be content in it. I know how to be humbled, and I also know how to abound. In any and all circumstances I have learned the secret both to be filled and to be hungry, both to abound and to be in need. I can do all things through Christ who strengthens me.","source":"https://ebible.org/engwebp/PHP04.htm#V11"},{"id":"mic-6-8","theme":"decisions","reference":"Micah 6:8","text":"He has shown you, O man, what is good. What does the LORD require of you, but to act justly, to love mercy, and to walk humbly with your God?","source":"https://ebible.org/engwebp/MIC06.htm#V8"},{"id":"psa-4-8","theme":"rest","reference":"Psalm 4:8","text":"In peace I will both lay myself down and sleep, for you alone, LORD, make me live in safety.","source":"https://ebible.org/engwebp/PSA004.htm#V8"},{"id":"2co-4-16-18","theme":"hardship","reference":"2 Corinthians 4:16–18","text":"Therefore we don’t faint, but though our outward person is decaying, yet our inward person is renewed day by day. For our light affliction, which is for the moment, works for us more and more exceedingly an eternal weight of glory, while we don’t look at the things which are seen, but at the things which are not seen. For the things which are seen are temporal, but the things which are not seen are eternal.","source":"https://ebible.org/engwebp/2CO04.htm#V16"},{"id":"heb-13-15-16","theme":"gratitude","reference":"Hebrews 13:15–16","text":"Through him, then, let’s offer up a sacrifice of praise to God continually, that is, the fruit of lips which proclaim allegiance to his name. But don’t forget to be doing good and sharing, for with such sacrifices God is well pleased.","source":"https://ebible.org/engwebp/HEB13.htm#V15"},{"id":"jas-5-13","theme":"faith","reference":"James 5:13","text":"Is any among you suffering? Let him pray. Is any cheerful? Let him sing praises.","source":"https://ebible.org/engwebp/JAS05.htm#V13"},{"id":"1pe-4-8","theme":"family","reference":"1 Peter 4:8","text":"And above all things be earnest in your love among yourselves, for love covers a multitude of sins.","source":"https://ebible.org/engwebp/1PE04.htm#V8"},{"id":"rom-12-15-16","theme":"relationships","reference":"Romans 12:15–16","text":"Rejoice with those who rejoice. Weep with those who weep. Be of the same mind one toward another. Don’t set your mind on high things, but associate with the humble. Don’t be wise in your own conceits.","source":"https://ebible.org/engwebp/ROM12.htm#V15"},{"id":"ecc-3-12-13","theme":"work","reference":"Ecclesiastes 3:12–13","text":"I know that there is nothing better for them than to rejoice, and to do good as long as they live. Also that every man should eat and drink, and enjoy good in all his labor, is the gift of God.","source":"https://ebible.org/engwebp/ECC03.htm#V12"},{"id":"pro-15-16-17","theme":"money","reference":"Proverbs 15:16–17","text":"Better is little, with the fear of the LORD, than great treasure with trouble. Better is a dinner of herbs, where love is, than a fattened calf with hatred.","source":"https://ebible.org/engwebp/PRO15.htm#V16"},{"id":"rom-12-1-2","theme":"decisions","reference":"Romans 12:1–2","text":"Therefore I urge you, brothers, by the mercies of God, to present your bodies a living sacrifice, holy, acceptable to God, which is your spiritual service. Don’t be conformed to this world, but be transformed by the renewing of your mind, so that you may prove what is the good, well-pleasing, and perfect will of God.","source":"https://ebible.org/engwebp/ROM12.htm#V1"},{"id":"1pe-5-6-7","theme":"rest","reference":"1 Peter 5:6–7","text":"Humble yourselves therefore under the mighty hand of God, that he may exalt you in due time, casting all your worries on him, because he cares for you.","source":"https://ebible.org/engwebp/1PE05.htm#V6"},{"id":"mat-5-4","theme":"hardship","reference":"Matthew 5:4","text":"Blessed are those who mourn, for they shall be comforted.","source":"https://ebible.org/engwebp/MAT05.htm#V4"},{"id":"jas-1-16-17","theme":"gratitude","reference":"James 1:16–17","text":"Don’t be deceived, my beloved brothers. Every good gift and every perfect gift is from above, coming down from the Father of lights, with whom can be no variation nor turning shadow.","source":"https://ebible.org/engwebp/JAS01.htm#V16"},{"id":"heb-11-1","theme":"faith","reference":"Hebrews 11:1","text":"Now faith is assurance of things hoped for, proof of things not seen.","source":"https://ebible.org/engwebp/HEB11.htm#V1"},{"id":"1co-16-14","theme":"family","reference":"1 Corinthians 16:14","text":"Let all that you do be done in love.","source":"https://ebible.org/engwebp/1CO16.htm#V14"},{"id":"1jn-3-16-18","theme":"relationships","reference":"1 John 3:16–18","text":"By this we know love, because he laid down his life for us. And we ought to lay down our lives for the brothers. But whoever has the world’s goods and sees his brother in need, then closes his heart of compassion against him, how does God’s love remain in him? My little children, let’s not love in word only, or with the tongue only, but in deed and truth.","source":"https://ebible.org/engwebp/1JN03.htm#V16"},{"id":"1co-15-58","theme":"work","reference":"1 Corinthians 15:58","text":"Therefore, my beloved brothers, be steadfast, immovable, always abounding in the Lord’s work, because you know that your labor is not in vain in the Lord.","source":"https://ebible.org/engwebp/1CO15.htm#V58"},{"id":"pro-22-1-2","theme":"money","reference":"Proverbs 22:1–2","text":"A good name is more desirable than great riches, and loving favor is better than silver and gold. The rich and the poor have this in common: The LORD is the maker of them all.","source":"https://ebible.org/engwebp/PRO22.htm#V1"},{"id":"eph-5-15-17","theme":"decisions","reference":"Ephesians 5:15–17","text":"Therefore watch carefully how you walk, not as unwise, but as wise, redeeming the time, because the days are evil. Therefore, don’t be foolish, but understand what the will of the Lord is.","source":"https://ebible.org/engwebp/EPH05.htm#V15"},{"id":"2th-3-16","theme":"rest","reference":"2 Thessalonians 3:16","text":"Now may the Lord of peace himself give you peace at all times in all ways. The Lord be with you all.","source":"https://ebible.org/engwebp/2TH03.htm#V16"},{"id":"psa-94-17-19","theme":"hardship","reference":"Psalm 94:17–19","text":"Unless the LORD had been my help, my soul would have soon lived in silence. When I said, “My foot is slipping!” Your loving kindness, LORD, held me up. In the multitude of my thoughts within me, your comforts delight my soul.","source":"https://ebible.org/engwebp/PSA094.htm#V17"},{"id":"psa-145-8-10","theme":"gratitude","reference":"Psalm 145:8–10","text":"The LORD is gracious, merciful, slow to anger, and of great loving kindness. The LORD is good to all. His tender mercies are over all his works. All your works will give thanks to you, LORD. Your saints will extol you.","source":"https://ebible.org/engwebp/PSA145.htm#V8"},{"id":"1jn-5-14-15","theme":"faith","reference":"1 John 5:14–15","text":"This is the boldness which we have toward him, that if we ask anything according to his will, he listens to us. And if we know that he listens to us, whatever we ask, we know that we have the petitions which we have asked of him.","source":"https://ebible.org/engwebp/1JN05.htm#V14"},{"id":"rut-1-16-17","theme":"family","reference":"Ruth 1:16–17","text":"Ruth said, “Don’t urge me to leave you, and to return from following you, for where you go, I will go; and where you stay, I will stay. Your people will be my people, and your God my God. Where you die, I will die, and there I will be buried. May the LORD do so to me, and more also, if anything but death parts you and me.”","source":"https://ebible.org/engwebp/RUT01.htm#V16"},{"id":"mat-5-44-45","theme":"relationships","reference":"Matthew 5:44–45","text":"But I tell you, love your enemies, bless those who curse you, do good to those who hate you, and pray for those who mistreat you and persecute you, that you may be children of your Father who is in heaven. For he makes his sun to rise on the evil and the good, and sends rain on the just and the unjust.","source":"https://ebible.org/engwebp/MAT05.htm#V44"},{"id":"heb-6-10","theme":"work","reference":"Hebrews 6:10","text":"For God is not unrighteous, so as to forget your work and the labor of love which you showed toward his name, in that you served the saints, and still do serve them.","source":"https://ebible.org/engwebp/HEB06.htm#V10"},{"id":"pro-22-9","theme":"money","reference":"Proverbs 22:9","text":"He who has a generous eye will be blessed, for he shares his food with the poor.","source":"https://ebible.org/engwebp/PRO22.htm#V9"},{"id":"pro-16-9","theme":"decisions","reference":"Proverbs 16:9","text":"A man’s heart plans his course, but the LORD directs his steps.","source":"https://ebible.org/engwebp/PRO16.htm#V9"},{"id":"psa-55-22","theme":"rest","reference":"Psalm 55:22","text":"Cast your burden on the LORD and he will sustain you. He will never allow the righteous to be moved.","source":"https://ebible.org/engwebp/PSA055.htm#V22"},{"id":"2co-1-3-4","theme":"hardship","reference":"2 Corinthians 1:3–4","text":"Blessed be the God and Father of our Lord Jesus Christ, the Father of mercies and God of all comfort, who comforts us in all our affliction, that we may be able to comfort those who are in any affliction, through the comfort with which we ourselves are comforted by God.","source":"https://ebible.org/engwebp/2CO01.htm#V3"},{"id":"col-3-15","theme":"gratitude","reference":"Colossians 3:15","text":"And let the peace of God rule in your hearts, to which also you were called in one body, and be thankful.","source":"https://ebible.org/engwebp/COL03.htm#V15"},{"id":"psa-5-3","theme":"faith","reference":"Psalm 5:3","text":"LORD, in the morning you will hear my voice. In the morning I will lay my requests before you, and will watch expectantly.","source":"https://ebible.org/engwebp/PSA005.htm#V3"},{"id":"psa-127-3","theme":"family","reference":"Psalm 127:3","text":"Behold, children are a heritage of the LORD. The fruit of the womb is his reward.","source":"https://ebible.org/engwebp/PSA127.htm#V3"},{"id":"eph-4-1-3","theme":"relationships","reference":"Ephesians 4:1–3","text":"I therefore, the prisoner in the Lord, beg you to walk worthily of the calling with which you were called, with all lowliness and humility, with patience, bearing with one another in love, being eager to keep the unity of the Spirit in the bond of peace.","source":"https://ebible.org/engwebp/EPH04.htm#V1"},{"id":"mat-5-16","theme":"work","reference":"Matthew 5:16","text":"Even so, let your light shine before men, that they may see your good works and glorify your Father who is in heaven.","source":"https://ebible.org/engwebp/MAT05.htm#V16"},{"id":"pro-19-17","theme":"money","reference":"Proverbs 19:17","text":"He who has pity on the poor lends to the LORD; he will reward him.","source":"https://ebible.org/engwebp/PRO19.htm#V17"},{"id":"jas-3-17-18","theme":"decisions","reference":"James 3:17–18","text":"But the wisdom that is from above is first pure, then peaceful, gentle, reasonable, full of mercy and good fruits, without partiality, and without hypocrisy. Now the fruit of righteousness is sown in peace by those who make peace.","source":"https://ebible.org/engwebp/JAS03.htm#V17"},{"id":"pro-12-25","theme":"rest","reference":"Proverbs 12:25","text":"Anxiety in a man’s heart weighs it down, but a kind word makes it glad.","source":"https://ebible.org/engwebp/PRO12.htm#V25"},{"id":"psa-73-25-26","theme":"hardship","reference":"Psalm 73:25–26","text":"Whom do I have in heaven? There is no one on earth whom I desire besides you. My flesh and my heart fails, but God is the strength of my heart and my portion forever.","source":"https://ebible.org/engwebp/PSA073.htm#V25"},{"id":"col-2-6-7","theme":"gratitude","reference":"Colossians 2:6–7","text":"As therefore you received Christ Jesus the Lord, walk in him, rooted and built up in him and established in the faith, even as you were taught, abounding in it in thanksgiving.","source":"https://ebible.org/engwebp/COL02.htm#V6"},{"id":"rom-8-26-27","theme":"faith","reference":"Romans 8:26–27","text":"In the same way, the Spirit also helps our weaknesses, for we don’t know how to pray as we ought. But the Spirit himself makes intercession for us with groanings which can’t be uttered. He who searches the hearts knows what is on the Spirit’s mind, because he makes intercession for the saints according to God.","source":"https://ebible.org/engwebp/ROM08.htm#V26"},{"id":"pro-14-26","theme":"family","reference":"Proverbs 14:26","text":"In the fear of the LORD is a secure fortress, and he will be a refuge for his children.","source":"https://ebible.org/engwebp/PRO14.htm#V26"},{"id":"jas-1-19-20","theme":"relationships","reference":"James 1:19–20","text":"So, then, my beloved brothers, let every man be swift to hear, slow to speak, and slow to anger; for the anger of man doesn’t produce the righteousness of God.","source":"https://ebible.org/engwebp/JAS01.htm#V19"},{"id":"gal-6-9-10","theme":"work","reference":"Galatians 6:9–10","text":"Let’s not be weary in doing good, for we will reap in due season if we don’t give up. So then, as we have opportunity, let’s do what is good toward all men, and especially toward those who are of the household of the faith.","source":"https://ebible.org/engwebp/GAL06.htm#V9"},{"id":"2co-9-6-7","theme":"money","reference":"2 Corinthians 9:6–7","text":"Remember this: he who sows sparingly will also reap sparingly. He who sows bountifully will also reap bountifully. Let each man give according as he has determined in his heart, not grudgingly or under compulsion, for God loves a cheerful giver.","source":"https://ebible.org/engwebp/2CO09.htm#V6"},{"id":"col-4-5-6","theme":"decisions","reference":"Colossians 4:5–6","text":"Walk in wisdom toward those who are outside, redeeming the time. Let your speech always be with grace, seasoned with salt, that you may know how you ought to answer each one.","source":"https://ebible.org/engwebp/COL04.htm#V5"},{"id":"mat-6-33-34","theme":"rest","reference":"Matthew 6:33–34","text":"But seek first God’s Kingdom and his righteousness; and all these things will be given to you as well. Therefore don’t be anxious for tomorrow, for tomorrow will be anxious for itself. Each day’s own evil is sufficient.","source":"https://ebible.org/engwebp/MAT06.htm#V33"},{"id":"isa-41-10","theme":"hardship","reference":"Isaiah 41:10","text":"Don’t you be afraid, for I am with you. Don’t be dismayed, for I am your God. I will strengthen you. Yes, I will help you. Yes, I will uphold you with the right hand of my righteousness.","source":"https://ebible.org/engwebp/ISA41.htm#V10"},{"id":"psa-100-4-5","theme":"gratitude","reference":"Psalm 100:4–5","text":"Enter into his gates with thanksgiving, and into his courts with praise. Give thanks to him, and bless his name. For the LORD is good. His loving kindness endures forever, his faithfulness to all generations.","source":"https://ebible.org/engwebp/PSA100.htm#V4"},{"id":"psa-139-23-24","theme":"faith","reference":"Psalm 139:23–24","text":"Search me, God, and know my heart. Try me, and know my thoughts. See if there is any wicked way in me, and lead me in the everlasting way.","source":"https://ebible.org/engwebp/PSA139.htm#V23"},{"id":"pro-23-22","theme":"family","reference":"Proverbs 23:22","text":"Listen to your father who gave you life, and don’t despise your mother when she is old.","source":"https://ebible.org/engwebp/PRO23.htm#V22"},{"id":"pro-15-1","theme":"relationships","reference":"Proverbs 15:1","text":"A gentle answer turns away wrath, but a harsh word stirs up anger.","source":"https://ebible.org/engwebp/PRO15.htm#V1"},{"id":"eph-4-28","theme":"work","reference":"Ephesians 4:28","text":"Let him who stole steal no more; but rather let him labor, producing with his hands something that is good, that he may have something to give to him who has need.","source":"https://ebible.org/engwebp/EPH04.htm#V28"},{"id":"pro-23-4-5","theme":"money","reference":"Proverbs 23:4–5","text":"Don’t weary yourself to be rich. In your wisdom, show restraint. Why do you set your eyes on that which is not? For it certainly sprouts wings like an eagle and flies in the sky.","source":"https://ebible.org/engwebp/PRO23.htm#V4"},{"id":"psa-90-12","theme":"decisions","reference":"Psalm 90:12","text":"So teach us to count our days, that we may gain a heart of wisdom.","source":"https://ebible.org/engwebp/PSA090.htm#V12"},{"id":"psa-56-3-4","theme":"rest","reference":"Psalm 56:3–4","text":"When I am afraid, I will put my trust in you. In God, I praise his word. In God, I put my trust. I will not be afraid. What can flesh do to me?","source":"https://ebible.org/engwebp/PSA056.htm#V3"},{"id":"rom-8-38-39","theme":"hardship","reference":"Romans 8:38–39","text":"For I am persuaded that neither death, nor life, nor angels, nor principalities, nor things present, nor things to come, nor powers, nor height, nor depth, nor any other created thing will be able to separate us from God’s love which is in Christ Jesus our Lord.","source":"https://ebible.org/engwebp/ROM08.htm#V38"},{"id":"psa-95-1-2","theme":"gratitude","reference":"Psalm 95:1–2","text":"Oh come, let’s sing to the LORD. Let’s shout aloud to the rock of our salvation! Let’s come before his presence with thanksgiving. Let’s extol him with songs!","source":"https://ebible.org/engwebp/PSA095.htm#V1"},{"id":"jhn-15-4-5","theme":"faith","reference":"John 15:4–5","text":"Remain in me, and I in you. As the branch can’t bear fruit by itself unless it remains in the vine, so neither can you, unless you remain in me. I am the vine. You are the branches. He who remains in me and I in him bears much fruit, for apart from me you can do nothing.","source":"https://ebible.org/engwebp/JHN15.htm#V4"},{"id":"pro-24-3-4","theme":"family","reference":"Proverbs 24:3–4","text":"Through wisdom a house is built; by understanding it is established; by knowledge the rooms are filled with all rare and beautiful treasure.","source":"https://ebible.org/engwebp/PRO24.htm#V3"},{"id":"ecc-4-9-10","theme":"relationships","reference":"Ecclesiastes 4:9–10","text":"Two are better than one, because they have a good reward for their labor. For if they fall, the one will lift up his fellow; but woe to him who is alone when he falls, and doesn’t have another to lift him up.","source":"https://ebible.org/engwebp/ECC04.htm#V9"},{"id":"1pe-4-10-11","theme":"work","reference":"1 Peter 4:10–11","text":"As each has received a gift, employ it in serving one another, as good managers of the grace of God in its various forms. If anyone speaks, let it be as it were the very words of God. If anyone serves, let it be as of the strength which God supplies, that in all things God may be glorified through Jesus Christ, to whom belong the glory and the dominion forever and ever. Amen.","source":"https://ebible.org/engwebp/1PE04.htm#V10"},{"id":"luk-12-15","theme":"money","reference":"Luke 12:15","text":"He said to them, “Beware! Keep yourselves from covetousness, for a man’s life doesn’t consist of the abundance of the things which he possesses.”","source":"https://ebible.org/engwebp/LUK12.htm#V15"},{"id":"pro-15-22","theme":"decisions","reference":"Proverbs 15:22","text":"Where there is no counsel, plans fail; but in a multitude of counselors they are established.","source":"https://ebible.org/engwebp/PRO15.htm#V22"},{"id":"psa-62-5-6","theme":"rest","reference":"Psalm 62:5–6","text":"My soul, wait in silence for God alone, for my expectation is from him. He alone is my rock and my salvation, my fortress. I will not be shaken.","source":"https://ebible.org/engwebp/PSA062.htm#V5"},{"id":"rev-21-3-4","theme":"hardship","reference":"Revelation 21:3–4","text":"I heard a loud voice out of heaven saying, “Behold, God’s dwelling is with people; and he will dwell with them, and they will be his people, and God himself will be with them as their God. He will wipe away every tear from their eyes. Death will be no more; neither will there be mourning, nor crying, nor pain any more. The first things have passed away.”","source":"https://ebible.org/engwebp/REV21.htm#V3"},{"id":"php-4-4-5","theme":"gratitude","reference":"Philippians 4:4–5","text":"Rejoice in the Lord always! Again I will say, “Rejoice!” Let your gentleness be known to all men. The Lord is at hand.","source":"https://ebible.org/engwebp/PHP04.htm#V4"},{"id":"rom-15-13","theme":"faith","reference":"Romans 15:13","text":"Now may the God of hope fill you with all joy and peace in believing, that you may abound in hope in the power of the Holy Spirit.","source":"https://ebible.org/engwebp/ROM15.htm#V13"}],"translations":{"fr":{"translation":{"name":"Louis Segond 1910","abbreviation":"LSG1910","language":"fr","edition":"1910 (fraLSG)","license":"Public domain","source":"https://ebible.org/fraLSG/"},"provenance":{"imported_on":"2026-10-02","archive_sha256":"4984d70c9065e672ec4e3a71bcd45a23b3a8606c4a2224abcca200942ce7425c"},"themes":[{"id":"family","name":"Famille et foyer"},{"id":"relationships","name":"Relations"},{"id":"work","name":"Travail et vocation"},{"id":"money","name":"Argent et générosité"},{"id":"decisions","name":"Choix et direction"},{"id":"rest","name":"Inquiétude et repos"},{"id":"hardship","name":"Épreuves et deuil"},{"id":"gratitude","name":"Joie et gratitude"},{"id":"faith","name":"Foi et prière"}],"verses":[{"id":"pro-1-8-9","theme":"family","reference":"Proverbes 1:8–9","text":"Écoute, mon fils, l’instruction de ton père, Et ne rejette pas l’enseignement de ta mère; Car c’est une couronne de grâce pour ta tête, Et une parure pour ton cou.","source":"https://ebible.org/fraLSG/PRO01.htm#V8"},{"id":"rom-13-8-10","theme":"relationships","reference":"Romains 13:8–10","text":"Ne devez rien à personne, si ce n’est de vous aimer les uns les autres; car celui qui aime les autres a accompli la loi. En effet, les commandements: Tu ne commettras point d’adultère, tu ne tueras point, tu ne déroberas point, tu ne convoiteras point, et ceux qu’il peut encore y avoir, se résument dans cette parole: Tu aimeras ton prochain comme toi-même. L’amour ne fait point de mal au prochain: l’amour est donc l’accomplissement de la loi.","source":"https://ebible.org/fraLSG/ROM13.htm#V8"},{"id":"pro-16-3","theme":"work","reference":"Proverbes 16:3","text":"Recommande à l’Éternel tes œuvres, Et tes projets réussiront.","source":"https://ebible.org/fraLSG/PRO16.htm#V3"},{"id":"heb-13-5-6","theme":"money","reference":"Hébreux 13:5–6","text":"Ne vous livrez pas à l’amour de l’argent; contentez-vous de ce que vous avez; car Dieu lui-même a dit: Je ne te délaisserai point, et je ne t’abandonnerai point. C’est donc avec assurance que nous pouvons dire: Le Seigneur est mon aide, je ne craindrai rien; Que peut me faire un homme?","source":"https://ebible.org/fraLSG/HEB13.htm#V5"},{"id":"jas-1-5","theme":"decisions","reference":"Jacques 1:5","text":"Si quelqu’un d’entre vous manque de sagesse, qu’il la demande à Dieu, qui donne à tous simplement et sans reproche, et elle lui sera donnée.","source":"https://ebible.org/fraLSG/JAS01.htm#V5"},{"id":"jhn-14-27","theme":"rest","reference":"Jean 14:27","text":"Je vous laisse la paix, je vous donne ma paix. Je ne vous donne pas comme le monde donne. Que votre cœur ne se trouble point, et ne s’alarme point.","source":"https://ebible.org/fraLSG/JHN14.htm#V27"},{"id":"psa-34-17-18","theme":"hardship","reference":"Psaumes 34:18–19","text":"Quand les justes crient, l’Éternel entend, Et il les délivre de toutes leurs détresses; L’Éternel est près de ceux qui ont le cœur brisé, Et il sauve ceux qui ont l’esprit dans l’abattement.","source":"https://ebible.org/fraLSG/PSA034.htm#V18"},{"id":"1th-5-16-18","theme":"gratitude","reference":"1 Thessaloniciens 5:16–18","text":"Soyez toujours joyeux. Priez sans cesse. Rendez grâces en toutes choses, car c’est à votre égard la volonté de Dieu en Jésus-Christ.","source":"https://ebible.org/fraLSG/1TH05.htm#V16"},{"id":"heb-4-14-16","theme":"faith","reference":"Hébreux 4:14–16","text":"Ainsi, puisque nous avons un grand souverain sacrificateur qui a traversé les cieux, Jésus, le Fils de Dieu, demeurons fermes dans la foi que nous professons. Car nous n’avons pas un souverain sacrificateur qui ne puisse compatir à nos faiblesses; au contraire, il a été tenté comme nous en toutes choses, sans commettre de péché. Approchons-nous donc avec assurance du trône de la grâce, afin d’obtenir miséricorde et de trouver grâce, pour être secourus dans nos besoins.","source":"https://ebible.org/fraLSG/HEB04.htm#V14"},{"id":"eph-6-1-3","theme":"family","reference":"Éphésiens 6:1–3","text":"Enfants, obéissez à vos parents, selon le Seigneur, car cela est juste. Honore ton père et ta mère (c’est le premier commandement avec une promesse), afin que tu sois heureux et que tu vives longtemps sur la terre.","source":"https://ebible.org/fraLSG/EPH06.htm#V1"},{"id":"1co-13-4-7","theme":"relationships","reference":"1 Corinthiens 13:4–7","text":"La charité est patiente, elle est pleine de bonté; la charité n’est point envieuse; la charité ne se vante point, elle ne s’enfle point d’orgueil, elle ne fait rien de malhonnête, elle ne cherche point son intérêt, elle ne s’irrite point, elle ne soupçonne point le mal, elle ne se réjouit point de l’injustice, mais elle se réjouit de la vérité; elle excuse tout, elle croit tout, elle espère tout, elle supporte tout.","source":"https://ebible.org/fraLSG/1CO13.htm#V4"},{"id":"pro-14-23","theme":"work","reference":"Proverbes 14:23","text":"Tout travail procure l’abondance, Mais les paroles en l’air ne mènent qu’à la disette.","source":"https://ebible.org/fraLSG/PRO14.htm#V23"},{"id":"1ti-6-6-8","theme":"money","reference":"1 Timothée 6:6–8","text":"C’est, en effet, une grande source de gain que la piété avec le contentement; car nous n’avons rien apporté dans le monde, et il est évident que nous n’en pouvons rien emporter; si donc nous avons la nourriture et le vêtement, cela nous suffira.","source":"https://ebible.org/fraLSG/1TI06.htm#V6"},{"id":"psa-119-130","theme":"decisions","reference":"Psaumes 119:130","text":"La révélation de tes paroles éclaire, Elle donne de l’intelligence aux simples.","source":"https://ebible.org/fraLSG/PSA119.htm#V130"},{"id":"php-4-6-7","theme":"rest","reference":"Philippiens 4:6–7","text":"Ne vous inquiétez de rien; mais en toute chose faites connaître vos besoins à Dieu par des prières et des supplications, avec des actions de grâces. Et la paix de Dieu, qui surpasse toute intelligence, gardera vos cœurs et vos pensées en Jésus-Christ.","source":"https://ebible.org/fraLSG/PHP04.htm#V6"},{"id":"lam-3-22-24","theme":"hardship","reference":"Lamentations 3:22–24","text":"Les bontés de l’Éternel ne sont pas épuisées, Ses compassions ne sont pas à leur terme; Elles se renouvellent chaque matin. Oh! Que ta fidélité est grande! L’Éternel est mon partage, dit mon âme; C’est pourquoi je veux espérer en lui.","source":"https://ebible.org/fraLSG/LAM03.htm#V22"},{"id":"psa-107-1","theme":"gratitude","reference":"Psaumes 107:1","text":"Louez l’Éternel, car il est bon, Car sa miséricorde dure à toujours!","source":"https://ebible.org/fraLSG/PSA107.htm#V1"},{"id":"psa-145-18-19","theme":"faith","reference":"Psaumes 145:18–19","text":"L’Éternel est près de tous ceux qui l’invoquent, De tous ceux qui l’invoquent avec sincérité; Il accomplit les désirs de ceux qui le craignent, Il entend leur cri et il les sauve.","source":"https://ebible.org/fraLSG/PSA145.htm#V18"},{"id":"eph-6-4","theme":"family","reference":"Éphésiens 6:4","text":"Et vous, pères, n’irritez pas vos enfants, mais élevez-les en les corrigeant et en les instruisant selon le Seigneur.","source":"https://ebible.org/fraLSG/EPH06.htm#V4"},{"id":"eph-4-32","theme":"relationships","reference":"Éphésiens 4:32","text":"Soyez bons les uns envers les autres, compatissants, vous pardonnant réciproquement, comme Dieu vous a pardonné en Christ.","source":"https://ebible.org/fraLSG/EPH04.htm#V32"},{"id":"col-3-23-24","theme":"work","reference":"Colossiens 3:23–24","text":"Tout ce que vous faites, faites-le de bon cœur, comme pour le Seigneur et non pour des hommes, sachant que vous recevrez du Seigneur l’héritage pour récompense. Servez Christ, le Seigneur.","source":"https://ebible.org/fraLSG/COL03.htm#V23"},{"id":"1ti-6-9-10","theme":"money","reference":"1 Timothée 6:9–10","text":"Mais ceux qui veulent s’enrichir tombent dans la tentation, dans le piège, et dans beaucoup de désirs insensés et pernicieux qui plongent les hommes dans la ruine et la perdition. Car l’amour de l’argent est une racine de tous les maux; et quelques-uns, en étant possédés, se sont égarés loin de la foi, et se sont jetés eux-mêmes dans bien des tourments.","source":"https://ebible.org/fraLSG/1TI06.htm#V9"},{"id":"pro-3-5-6","theme":"decisions","reference":"Proverbes 3:5–6","text":"Confie-toi en l’Éternel de tout ton cœur, Et ne t’appuie pas sur ta sagesse; Reconnais-le dans toutes tes voies, Et il aplanira tes sentiers.","source":"https://ebible.org/fraLSG/PRO03.htm#V5"},{"id":"isa-26-3-4","theme":"rest","reference":"Ésaïe 26:3–4","text":"A celui qui est ferme dans ses sentiments Tu assures la paix, la paix, Parce qu’il se confie en toi. Confiez-vous en l’Éternel à perpétuité, Car l’Éternel, l’Éternel est le rocher des siècles.","source":"https://ebible.org/fraLSG/ISA26.htm#V3"},{"id":"psa-42-11","theme":"hardship","reference":"Psaumes 42:12","text":"Pourquoi t’abats-tu, mon âme, et gémis-tu au-dedans de moi? Espère en Dieu, car je le louerai encore; Il est mon salut et mon Dieu.","source":"https://ebible.org/fraLSG/PSA042.htm#V12"},{"id":"col-3-17","theme":"gratitude","reference":"Colossiens 3:17","text":"Et quoi que vous fassiez, en parole ou en œuvre, faites tout au nom du Seigneur Jésus, en rendant par lui des actions de grâces à Dieu le Père.","source":"https://ebible.org/fraLSG/COL03.htm#V17"},{"id":"eph-2-8-10","theme":"faith","reference":"Éphésiens 2:8–10","text":"Car c’est par la grâce que vous êtes sauvés, par le moyen de la foi. Et cela ne vient pas de vous, c’est le don de Dieu. Ce n’est point par les œuvres, afin que personne ne se glorifie. Car nous sommes son ouvrage, ayant été créés en Jésus-Christ pour de bonnes œuvres, que Dieu a préparées d’avance, afin que nous les pratiquions.","source":"https://ebible.org/fraLSG/EPH02.htm#V8"},{"id":"gal-6-2","theme":"family","reference":"Galates 6:2","text":"Portez les fardeaux les uns des autres, et vous accomplirez ainsi la loi de Christ.","source":"https://ebible.org/fraLSG/GAL06.htm#V2"},{"id":"col-3-12-14","theme":"relationships","reference":"Colossiens 3:12–14","text":"Ainsi donc, comme des élus de Dieu, saints et bien-aimés, revêtez-vous d’entrailles de miséricorde, de bonté, d’humilité, de douceur, de patience. Supportez-vous les uns les autres, et, si l’un a sujet de se plaindre de l’autre, pardonnez-vous réciproquement. De même que Christ vous a pardonné, pardonnez-vous aussi. Mais par-dessus toutes ces choses revêtez-vous de la charité, qui est le lien de la perfection.","source":"https://ebible.org/fraLSG/COL03.htm#V12"},{"id":"pro-12-11","theme":"work","reference":"Proverbes 12:11","text":"Celui qui cultive son champ est rassasié de pain, Mais celui qui poursuit des choses vaines est dépourvu de sens.","source":"https://ebible.org/fraLSG/PRO12.htm#V11"},{"id":"1ti-6-17-19","theme":"money","reference":"1 Timothée 6:17–19","text":"Recommande aux riches du présent siècle de ne pas être orgueilleux, et de ne pas mettre leur espérance dans des richesses incertaines, mais de la mettre en Dieu, qui nous donne avec abondance toutes choses pour que nous en jouissions. Recommande-leur de faire du bien, d’être riches en bonnes œuvres, d’avoir de la libéralité, de la générosité, et de s’amasser ainsi pour l’avenir un trésor placé sur un fondement solide, afin de saisir la vie véritable.","source":"https://ebible.org/fraLSG/1TI06.htm#V17"},{"id":"pro-4-23","theme":"decisions","reference":"Proverbes 4:23","text":"Garde ton cœur plus que toute autre chose, Car de lui viennent les sources de la vie.","source":"https://ebible.org/fraLSG/PRO04.htm#V23"},{"id":"mat-11-28-30","theme":"rest","reference":"Matthieu 11:28–30","text":"Venez à moi, vous tous qui êtes fatigués et chargés, et je vous donnerai du repos. Prenez mon joug sur vous et recevez mes instructions, car je suis doux et humble de cœur; et vous trouverez du repos pour vos âmes. Car mon joug est doux, et mon fardeau léger.","source":"https://ebible.org/fraLSG/MAT11.htm#V28"},{"id":"rom-5-3-5","theme":"hardship","reference":"Romains 5:3–5","text":"Bien plus, nous nous glorifions même des afflictions, sachant que l’affliction produit la persévérance, la persévérance la victoire dans l’épreuve, et cette victoire l’espérance. Or, l’espérance ne trompe point, parce que l’amour de Dieu est répandu dans nos cœurs par le Saint-Esprit qui nous a été donné.","source":"https://ebible.org/fraLSG/ROM05.htm#V3"},{"id":"psa-118-24","theme":"gratitude","reference":"Psaumes 118:24","text":"C’est ici la journée que l’Éternel a faite: Qu’elle soit pour nous un sujet d’allégresse et de joie!","source":"https://ebible.org/fraLSG/PSA118.htm#V24"},{"id":"col-4-2-4","theme":"faith","reference":"Colossiens 4:2–4","text":"Persévérez dans la prière, veillez-y avec actions de grâces. Priez en même temps pour nous, afin que Dieu nous ouvre une porte pour la parole, en sorte que je puisse annoncer le mystère de Christ, pour lequel je suis dans les chaînes, et le faire connaître comme je dois en parler.","source":"https://ebible.org/fraLSG/COL04.htm#V2"},{"id":"deu-6-4-7","theme":"family","reference":"Deutéronome 6:4–7","text":"Écoute, Israël! L’Éternel, notre Dieu, est le seul Éternel. Tu aimeras l’Éternel, ton Dieu, de tout ton cœur, de toute ton âme et de toute ta force. Et ces commandements, que je te donne aujourd’hui, seront dans ton cœur. Tu les inculqueras à tes enfants, et tu en parleras quand tu seras dans ta maison, quand tu iras en voyage, quand tu te coucheras et quand tu te lèveras.","source":"https://ebible.org/fraLSG/DEU06.htm#V4"},{"id":"rom-12-9-13","theme":"relationships","reference":"Romains 12:9–13","text":"Que la charité soit sans hypocrisie. Ayez le mal en horreur; attachez-vous fortement au bien. Par amour fraternel, soyez pleins d’affection les uns pour les autres; par honneur, usez de prévenances réciproques. Ayez du zèle, et non de la paresse. Soyez fervents d’esprit. Servez le Seigneur. Réjouissez-vous en espérance. Soyez patients dans l’affliction. Persévérez dans la prière. Pourvoyez aux besoins des saints. Exercez l’hospitalité.","source":"https://ebible.org/fraLSG/ROM12.htm#V9"},{"id":"psa-90-16-17","theme":"work","reference":"Psaumes 90:16–17","text":"Que ton œuvre se manifeste à tes serviteurs, Et ta gloire sur leurs enfants! Que la grâce de l’Éternel, notre Dieu, soit sur nous! Affermis l’ouvrage de nos mains, Oui, affermis l’ouvrage de nos mains!","source":"https://ebible.org/fraLSG/PSA090.htm#V16"},{"id":"php-4-11-13","theme":"money","reference":"Philippiens 4:11–13","text":"Ce n’est pas en vue de mes besoins que je dis cela, car j’ai appris à être content de l’état où je me trouve. Je sais vivre dans l’humiliation, et je sais vivre dans l’abondance. En tout et partout j’ai appris à être rassasié et à avoir faim, à être dans l’abondance et à être dans la disette. Je puis tout par celui qui me fortifie.","source":"https://ebible.org/fraLSG/PHP04.htm#V11"},{"id":"mic-6-8","theme":"decisions","reference":"Michée 6:8","text":"On t’a fait connaître, ô homme, ce qui est bien; Et ce que l’Éternel demande de toi, C’est que tu pratiques la justice, Que tu aimes la miséricorde, Et que tu marches humblement avec ton Dieu.","source":"https://ebible.org/fraLSG/MIC06.htm#V8"},{"id":"psa-4-8","theme":"rest","reference":"Psaumes 4:9","text":"Je me couche et je m’endors en paix, Car toi seul, ô Éternel! tu me donnes la sécurité dans ma demeure.","source":"https://ebible.org/fraLSG/PSA004.htm#V9"},{"id":"2co-4-16-18","theme":"hardship","reference":"2 Corinthiens 4:16–18","text":"C’est pourquoi nous ne perdons pas courage. Et lors même que notre homme extérieur se détruit, notre homme intérieur se renouvelle de jour en jour. Car nos légères afflictions du moment présent produisent pour nous, au-delà de toute mesure, un poids éternel de gloire, parce que nous regardons, non point aux choses visibles, mais à celles qui sont invisibles; car les choses visibles sont passagères, et les invisibles sont éternelles.","source":"https://ebible.org/fraLSG/2CO04.htm#V16"},{"id":"heb-13-15-16","theme":"gratitude","reference":"Hébreux 13:15–16","text":"Par lui, offrons sans cesse à Dieu un sacrifice de louange, c’est-à-dire le fruit de lèvres qui confessent son nom. Et n’oubliez pas la bienfaisance et la libéralité, car c’est à de tels sacrifices que Dieu prend plaisir.","source":"https://ebible.org/fraLSG/HEB13.htm#V15"},{"id":"jas-5-13","theme":"faith","reference":"Jacques 5:13","text":"Quelqu’un parmi vous est-il dans la souffrance? Qu’il prie. Quelqu’un est-il dans la joie? Qu’il chante des cantiques.","source":"https://ebible.org/fraLSG/JAS05.htm#V13"},{"id":"1pe-4-8","theme":"family","reference":"1 Pierre 4:8","text":"Avant tout, ayez les uns pour les autres une ardente charité, car La charité couvre une multitude de péchés.","source":"https://ebible.org/fraLSG/1PE04.htm#V8"},{"id":"rom-12-15-16","theme":"relationships","reference":"Romains 12:15–16","text":"Réjouissez-vous avec ceux qui se réjouissent; pleurez avec ceux qui pleurent. Ayez les mêmes sentiments les uns envers les autres. N’aspirez pas à ce qui est élevé, mais laissez-vous attirer par ce qui est humble. Ne soyez point sages à vos propres yeux.","source":"https://ebible.org/fraLSG/ROM12.htm#V15"},{"id":"ecc-3-12-13","theme":"work","reference":"Ecclésiaste 3:12–13","text":"J’ai reconnu qu’il n’y a de bonheur pour eux qu’à se réjouir et à se donner du bien-être pendant leur vie; mais que, si un homme mange et boit et jouit du bien-être au milieu de tout son travail, c’est là un don de Dieu.","source":"https://ebible.org/fraLSG/ECC03.htm#V12"},{"id":"pro-15-16-17","theme":"money","reference":"Proverbes 15:16–17","text":"Mieux vaut peu, avec la crainte de l’Éternel, Qu’un grand trésor, avec le trouble. Mieux vaut de l’herbe pour nourriture, là où règne l’amour, Qu’un bœuf engraissé, si la haine est là.","source":"https://ebible.org/fraLSG/PRO15.htm#V16"},{"id":"rom-12-1-2","theme":"decisions","reference":"Romains 12:1–2","text":"Je vous exhorte donc, frères, par les compassions de Dieu, à offrir vos corps comme un sacrifice vivant, saint, agréable à Dieu, ce qui sera de votre part un culte raisonnable. Ne vous conformez pas au siècle présent, mais soyez transformés par le renouvellement de l’intelligence, afin que vous discerniez quelle est la volonté de Dieu, ce qui est bon, agréable et parfait.","source":"https://ebible.org/fraLSG/ROM12.htm#V1"},{"id":"1pe-5-6-7","theme":"rest","reference":"1 Pierre 5:6–7","text":"Humiliez-vous donc sous la puissante main de Dieu, afin qu’il vous élève au temps convenable; et déchargez-vous sur lui de tous vos soucis, car lui-même prend soin de vous.","source":"https://ebible.org/fraLSG/1PE05.htm#V6"},{"id":"mat-5-4","theme":"hardship","reference":"Matthieu 5:4","text":"Heureux les affligés, car ils seront consolés!","source":"https://ebible.org/fraLSG/MAT05.htm#V4"},{"id":"jas-1-16-17","theme":"gratitude","reference":"Jacques 1:16–17","text":"Ne vous y trompez pas, mes frères bien-aimés: toute grâce excellente et tout don parfait descendent d’en haut, du Père des lumières, chez lequel il n’y a ni changement ni ombre de variation.","source":"https://ebible.org/fraLSG/JAS01.htm#V16"},{"id":"heb-11-1","theme":"faith","reference":"Hébreux 11:1","text":"Or la foi est une ferme assurance des choses qu’on espère, une démonstration de celles qu’on ne voit pas.","source":"https://ebible.org/fraLSG/HEB11.htm#V1"},{"id":"1co-16-14","theme":"family","reference":"1 Corinthiens 16:14","text":"Que tout ce que vous faites se fasse avec charité!","source":"https://ebible.org/fraLSG/1CO16.htm#V14"},{"id":"1jn-3-16-18","theme":"relationships","reference":"1 Jean 3:16–18","text":"Nous avons connu l’amour, en ce qu’il a donné sa vie pour nous; nous aussi, nous devons donner notre vie pour les frères. Si quelqu’un possède les biens du monde, et que, voyant son frère dans le besoin, il lui ferme ses entrailles, comment l’amour de Dieu demeure-t-il en lui? Petits enfants, n’aimons pas en paroles et avec la langue, mais en actions et avec vérité.","source":"https://ebible.org/fraLSG/1JN03.htm#V16"},{"id":"1co-15-58","theme":"work","reference":"1 Corinthiens 15:58","text":"Ainsi, mes frères bien-aimés, soyez fermes, inébranlables, travaillant de mieux en mieux à l’œuvre du Seigneur, sachant que votre travail ne sera pas vain dans le Seigneur.","source":"https://ebible.org/fraLSG/1CO15.htm#V58"},{"id":"pro-22-1-2","theme":"money","reference":"Proverbes 22:1–2","text":"La réputation est préférable à de grandes richesses, Et la grâce vaut mieux que l’argent et que l’or. Le riche et le pauvre se rencontrent; C’est l’Éternel qui les a faits l’un et l’autre.","source":"https://ebible.org/fraLSG/PRO22.htm#V1"},{"id":"eph-5-15-17","theme":"decisions","reference":"Éphésiens 5:15–17","text":"Prenez donc garde de vous conduire avec circonspection, non comme des insensés, mais comme des sages; rachetez le temps, car les jours sont mauvais. C’est pourquoi ne soyez pas inconsidérés, mais comprenez quelle est la volonté du Seigneur.","source":"https://ebible.org/fraLSG/EPH05.htm#V15"},{"id":"2th-3-16","theme":"rest","reference":"2 Thessaloniciens 3:16","text":"Que le Seigneur de la paix vous donne lui-même la paix en tout temps, de toute manière! Que le Seigneur soit avec vous tous!","source":"https://ebible.org/fraLSG/2TH03.htm#V16"},{"id":"psa-94-17-19","theme":"hardship","reference":"Psaumes 94:17–19","text":"Si l’Éternel n’était pas mon secours, Mon âme serait bien vite dans la demeure du silence. Quand je dis: Mon pied chancelle! Ta bonté, ô Éternel! Me sert d’appui. Quand les pensées s’agitent en foule au-dedans de moi, Tes consolations réjouissent mon âme.","source":"https://ebible.org/fraLSG/PSA094.htm#V17"},{"id":"psa-145-8-10","theme":"gratitude","reference":"Psaumes 145:8–10","text":"L’Éternel est miséricordieux et compatissant, Lent à la colère et plein de bonté. L’Éternel est bon envers tous, Et ses compassions s’étendent sur toutes ses œuvres. Toutes tes œuvres te loueront, ô Éternel! Et tes fidèles te béniront.","source":"https://ebible.org/fraLSG/PSA145.htm#V8"},{"id":"1jn-5-14-15","theme":"faith","reference":"1 Jean 5:14–15","text":"Nous avons auprès de lui cette assurance, que si nous demandons quelque chose selon sa volonté, il nous écoute. Et si nous savons qu’il nous écoute, quelque chose que nous demandions, nous savons que nous possédons la chose que nous lui avons demandée.","source":"https://ebible.org/fraLSG/1JN05.htm#V14"},{"id":"rut-1-16-17","theme":"family","reference":"Ruth 1:16–17","text":"Ruth répondit: Ne me presse pas de te laisser, de retourner loin de toi! Où tu iras j’irai, où tu demeureras je demeurerai; ton peuple sera mon peuple, et ton Dieu sera mon Dieu; où tu mourras je mourrai, et j’y serai enterrée. Que l’Éternel me traite dans toute sa rigueur, si autre chose que la mort vient à me séparer de toi!","source":"https://ebible.org/fraLSG/RUT01.htm#V16"},{"id":"mat-5-44-45","theme":"relationships","reference":"Matthieu 5:44–45","text":"Mais moi, je vous dis: Aimez vos ennemis, bénissez ceux qui vous maudissent, faites du bien à ceux qui vous haïssent, et priez pour ceux qui vous maltraitent et qui vous persécutent, afin que vous soyez fils de votre Père qui est dans les cieux; car il fait lever son soleil sur les méchants et sur les bons, et il fait pleuvoir sur les justes et sur les injustes.","source":"https://ebible.org/fraLSG/MAT05.htm#V44"},{"id":"heb-6-10","theme":"work","reference":"Hébreux 6:10","text":"Car Dieu n’est pas injuste, pour oublier votre travail et l’amour que vous avez montré pour son nom, ayant rendu et rendant encore des services aux saints.","source":"https://ebible.org/fraLSG/HEB06.htm#V10"},{"id":"pro-22-9","theme":"money","reference":"Proverbes 22:9","text":"L’homme dont le regard est bienveillant sera béni, Parce qu’il donne de son pain au pauvre.","source":"https://ebible.org/fraLSG/PRO22.htm#V9"},{"id":"pro-16-9","theme":"decisions","reference":"Proverbes 16:9","text":"Le cœur de l’homme médite sa voie, Mais c’est l’Éternel qui dirige ses pas.","source":"https://ebible.org/fraLSG/PRO16.htm#V9"},{"id":"psa-55-22","theme":"rest","reference":"Psaumes 55:23","text":"Remets ton sort à l’Éternel, et il te soutiendra, Il ne laissera jamais chanceler le juste.","source":"https://ebible.org/fraLSG/PSA055.htm#V23"},{"id":"2co-1-3-4","theme":"hardship","reference":"2 Corinthiens 1:3–4","text":"Béni soit Dieu, le Père de notre Seigneur Jésus-Christ, le Père des miséricordes et le Dieu de toute consolation, qui nous console dans toutes nos afflictions, afin que, par la consolation dont nous sommes l’objet de la part de Dieu, nous puissions consoler ceux qui se trouvent dans quelque affliction!","source":"https://ebible.org/fraLSG/2CO01.htm#V3"},{"id":"col-3-15","theme":"gratitude","reference":"Colossiens 3:15","text":"Et que la paix de Christ, à laquelle vous avez été appelés pour former un seul corps, règne dans vos cœurs. Et soyez reconnaissants.","source":"https://ebible.org/fraLSG/COL03.htm#V15"},{"id":"psa-5-3","theme":"faith","reference":"Psaumes 5:4","text":"Éternel! Le matin tu entends ma voix; Le matin je me tourne vers toi, et je regarde.","source":"https://ebible.org/fraLSG/PSA005.htm#V4"},{"id":"psa-127-3","theme":"family","reference":"Psaumes 127:3","text":"Voici, des fils sont un héritage de l’Éternel, Le fruit des entrailles est une récompense.","source":"https://ebible.org/fraLSG/PSA127.htm#V3"},{"id":"eph-4-1-3","theme":"relationships","reference":"Éphésiens 4:1–3","text":"Je vous exhorte donc, moi, le prisonnier dans le Seigneur, à marcher d’une manière digne de la vocation qui vous a été adressée, en toute humilité et douceur, avec patience, vous supportant les uns les autres avec charité, vous efforçant de conserver l’unité de l’esprit par le lien de la paix.","source":"https://ebible.org/fraLSG/EPH04.htm#V1"},{"id":"mat-5-16","theme":"work","reference":"Matthieu 5:16","text":"Que votre lumière luise ainsi devant les hommes, afin qu’ils voient vos bonnes œuvres, et qu’ils glorifient votre Père qui est dans les cieux.","source":"https://ebible.org/fraLSG/MAT05.htm#V16"},{"id":"pro-19-17","theme":"money","reference":"Proverbes 19:17","text":"Celui qui a pitié du pauvre prête à l’Éternel, Qui lui rendra selon son œuvre.","source":"https://ebible.org/fraLSG/PRO19.htm#V17"},{"id":"jas-3-17-18","theme":"decisions","reference":"Jacques 3:17–18","text":"La sagesse d’en haut est premièrement pure, ensuite pacifique, modérée, conciliante, pleine de miséricorde et de bons fruits, exempte de duplicité, d’hypocrisie. Le fruit de la justice est semé dans la paix par ceux qui recherchent la paix.","source":"https://ebible.org/fraLSG/JAS03.htm#V17"},{"id":"pro-12-25","theme":"rest","reference":"Proverbes 12:25","text":"L’inquiétude dans le cœur de l’homme l’abat, Mais une bonne parole le réjouit.","source":"https://ebible.org/fraLSG/PRO12.htm#V25"},{"id":"psa-73-25-26","theme":"hardship","reference":"Psaumes 73:25–26","text":"Quel autre ai-je au ciel que toi! Et sur la terre je ne prends plaisir qu’en toi. Ma chair et mon cœur peuvent se consumer: Dieu sera toujours le rocher de mon cœur et mon partage.","source":"https://ebible.org/fraLSG/PSA073.htm#V25"},{"id":"col-2-6-7","theme":"gratitude","reference":"Colossiens 2:6–7","text":"Ainsi donc, comme vous avez reçu le Seigneur Jésus-Christ, marchez en lui, étant enracinés et fondés en lui, et affermis par la foi, d’après les instructions qui vous ont été données, et abondez en actions de grâces.","source":"https://ebible.org/fraLSG/COL02.htm#V6"},{"id":"rom-8-26-27","theme":"faith","reference":"Romains 8:26–27","text":"De même aussi l’Esprit nous aide dans notre faiblesse, car nous ne savons pas ce qu’il nous convient de demander dans nos prières. Mais l’Esprit lui-même intercède par des soupirs inexprimables; et celui qui sonde les cœurs connaît quelle est la pensée de l’Esprit, parce que c’est selon Dieu qu’il intercède en faveur des saints.","source":"https://ebible.org/fraLSG/ROM08.htm#V26"},{"id":"pro-14-26","theme":"family","reference":"Proverbes 14:26","text":"Celui qui craint l’Éternel possède un appui ferme, Et ses enfants ont un refuge auprès de lui.","source":"https://ebible.org/fraLSG/PRO14.htm#V26"},{"id":"jas-1-19-20","theme":"relationships","reference":"Jacques 1:19–20","text":"Sachez-le, mes frères bien-aimés. Ainsi, que tout homme soit prompt à écouter, lent à parler, lent à se mettre en colère; car la colère de l’homme n’accomplit pas la justice de Dieu.","source":"https://ebible.org/fraLSG/JAS01.htm#V19"},{"id":"gal-6-9-10","theme":"work","reference":"Galates 6:9–10","text":"Ne nous lassons pas de faire le bien; car nous moissonnerons au temps convenable, si nous ne nous relâchons pas. Ainsi donc, pendant que nous en avons l’occasion, pratiquons le bien envers tous, et surtout envers les frères en la foi.","source":"https://ebible.org/fraLSG/GAL06.htm#V9"},{"id":"2co-9-6-7","theme":"money","reference":"2 Corinthiens 9:6–7","text":"Sachez-le, celui qui sème peu moissonnera peu, et celui qui sème abondamment moissonnera abondamment. Que chacun donne comme il l’a résolu en son cœur, sans tristesse ni contrainte; car Dieu aime celui qui donne avec joie.","source":"https://ebible.org/fraLSG/2CO09.htm#V6"},{"id":"col-4-5-6","theme":"decisions","reference":"Colossiens 4:5–6","text":"Conduisez-vous avec sagesse envers ceux du dehors, et rachetez le temps. Que votre parole soit toujours accompagnée de grâce, assaisonnée de sel, afin que vous sachiez comment il faut répondre à chacun.","source":"https://ebible.org/fraLSG/COL04.htm#V5"},{"id":"mat-6-33-34","theme":"rest","reference":"Matthieu 6:33–34","text":"Cherchez premièrement le royaume et la justice de Dieu; et toutes ces choses vous seront données par-dessus. Ne vous inquiétez donc pas du lendemain; car le lendemain aura soin de lui-même. A chaque jour suffit sa peine.","source":"https://ebible.org/fraLSG/MAT06.htm#V33"},{"id":"isa-41-10","theme":"hardship","reference":"Ésaïe 41:10","text":"Ne crains rien, car je suis avec toi; Ne promène pas des regards inquiets, car je suis ton Dieu; Je te fortifie, je viens à ton secours, Je te soutiens de ma droite triomphante.","source":"https://ebible.org/fraLSG/ISA41.htm#V10"},{"id":"psa-100-4-5","theme":"gratitude","reference":"Psaumes 100:4–5","text":"Entrez dans ses portes avec des louanges, Dans ses parvis avec des cantiques! Célébrez-le, bénissez son nom! Car l’Éternel est bon; sa bonté dure toujours, Et sa fidélité de génération en génération.","source":"https://ebible.org/fraLSG/PSA100.htm#V4"},{"id":"psa-139-23-24","theme":"faith","reference":"Psaumes 139:23–24","text":"Sonde-moi, ô Dieu, et connais mon cœur! Éprouve-moi, et connais mes pensées! Regarde si je suis sur une mauvaise voie, Et conduis-moi sur la voie de l’éternité!","source":"https://ebible.org/fraLSG/PSA139.htm#V23"},{"id":"pro-23-22","theme":"family","reference":"Proverbes 23:22","text":"Écoute ton père, lui qui t’a engendré, Et ne méprise pas ta mère, quand elle est devenue vieille.","source":"https://ebible.org/fraLSG/PRO23.htm#V22"},{"id":"pro-15-1","theme":"relationships","reference":"Proverbes 15:1","text":"Une réponse douce calme la fureur, Mais une parole dure excite la colère.","source":"https://ebible.org/fraLSG/PRO15.htm#V1"},{"id":"eph-4-28","theme":"work","reference":"Éphésiens 4:28","text":"Que celui qui dérobait ne dérobe plus; mais plutôt qu’il travaille, en faisant de ses mains ce qui est bien, pour avoir de quoi donner à celui qui est dans le besoin.","source":"https://ebible.org/fraLSG/EPH04.htm#V28"},{"id":"pro-23-4-5","theme":"money","reference":"Proverbes 23:4–5","text":"Ne te tourmente pas pour t’enrichir, N’y applique pas ton intelligence. Veux-tu poursuivre du regard ce qui va disparaître? Car la richesse se fait des ailes, Et comme l’aigle, elle prend son vol vers les cieux.","source":"https://ebible.org/fraLSG/PRO23.htm#V4"},{"id":"psa-90-12","theme":"decisions","reference":"Psaumes 90:12","text":"Enseigne-nous à bien compter nos jours, Afin que nous appliquions notre cœur à la sagesse.","source":"https://ebible.org/fraLSG/PSA090.htm#V12"},{"id":"psa-56-3-4","theme":"rest","reference":"Psaumes 56:4–5","text":"Quand je suis dans la crainte, En toi je me confie. Je me glorifierai en Dieu, en sa parole; Je me confie en Dieu, je ne crains rien: Que peuvent me faire des hommes?","source":"https://ebible.org/fraLSG/PSA056.htm#V4"},{"id":"rom-8-38-39","theme":"hardship","reference":"Romains 8:38–39","text":"Car j’ai l’assurance que ni la mort ni la vie, ni les anges ni les dominations, ni les choses présentes ni les choses à venir, ni les puissances, ni la hauteur, ni la profondeur, ni aucune autre créature ne pourra nous séparer de l’amour de Dieu manifesté en Jésus-Christ notre Seigneur.","source":"https://ebible.org/fraLSG/ROM08.htm#V38"},{"id":"psa-95-1-2","theme":"gratitude","reference":"Psaumes 95:1–2","text":"Venez, chantons avec allégresse à l’Éternel! Poussons des cris de joie vers le rocher de notre salut. Allons au-devant de lui avec des louanges, Faisons retentir des cantiques en son honneur!","source":"https://ebible.org/fraLSG/PSA095.htm#V1"},{"id":"jhn-15-4-5","theme":"faith","reference":"Jean 15:4–5","text":"Demeurez en moi, et je demeurerai en vous. Comme le sarment ne peut de lui-même porter du fruit, s’il ne demeure attaché au cep, ainsi vous ne le pouvez non plus, si vous ne demeurez en moi. Je suis le cep, vous êtes les sarments. Celui qui demeure en moi et en qui je demeure porte beaucoup de fruit, car sans moi vous ne pouvez rien faire.","source":"https://ebible.org/fraLSG/JHN15.htm#V4"},{"id":"pro-24-3-4","theme":"family","reference":"Proverbes 24:3–4","text":"C’est par la sagesse qu’une maison s’élève, Et par l’intelligence qu’elle s’affermit; C’est par la science que les chambres se remplissent De tous les biens précieux et agréables.","source":"https://ebible.org/fraLSG/PRO24.htm#V3"},{"id":"ecc-4-9-10","theme":"relationships","reference":"Ecclésiaste 4:9–10","text":"Deux valent mieux qu’un, parce qu’ils retirent un bon salaire de leur travail. Car, s’ils tombent, l’un relève son compagnon; mais malheur à celui qui est seul et qui tombe, sans avoir un second pour le relever!","source":"https://ebible.org/fraLSG/ECC04.htm#V9"},{"id":"1pe-4-10-11","theme":"work","reference":"1 Pierre 4:10–11","text":"Comme de bons dispensateurs des diverses grâces de Dieu, que chacun de vous mette au service des autres le don qu’il a reçu, Si quelqu’un parle, que ce soit comme annonçant les oracles de Dieu; si quelqu’un remplit un ministère, qu’il le remplisse selon la force que Dieu communique, afin qu’en toutes choses Dieu soit glorifié par Jésus-Christ, à qui appartiennent la gloire et la puissance, aux siècles des siècles. Amen!","source":"https://ebible.org/fraLSG/1PE04.htm#V10"},{"id":"luk-12-15","theme":"money","reference":"Luc 12:15","text":"Puis il leur dit: Gardez-vous avec soin de toute avarice; car la vie d’un homme ne dépend pas de ses biens, fût-il dans l’abondance.","source":"https://ebible.org/fraLSG/LUK12.htm#V15"},{"id":"pro-15-22","theme":"decisions","reference":"Proverbes 15:22","text":"Les projets échouent, faute d’une assemblée qui délibère; Mais ils réussissent quand il y a de nombreux conseillers.","source":"https://ebible.org/fraLSG/PRO15.htm#V22"},{"id":"psa-62-5-6","theme":"rest","reference":"Psaumes 62:6–7","text":"Oui, mon âme, confie-toi en Dieu! Car de lui vient mon espérance. Oui, c’est lui qui est mon rocher et mon salut; Ma haute retraite: je ne chancellerai pas.","source":"https://ebible.org/fraLSG/PSA062.htm#V6"},{"id":"rev-21-3-4","theme":"hardship","reference":"Apocalypse 21:3–4","text":"Et j’entendis du trône une forte voix qui disait: Voici le tabernacle de Dieu avec les hommes! Il habitera avec eux, et ils seront son peuple, et Dieu lui-même sera avec eux. Il essuiera toute larme de leurs yeux, et la mort ne sera plus, et il n’y aura plus ni deuil, ni cri, ni douleur, car les premières choses ont disparu.","source":"https://ebible.org/fraLSG/REV21.htm#V3"},{"id":"php-4-4-5","theme":"gratitude","reference":"Philippiens 4:4–5","text":"Réjouissez-vous toujours dans le Seigneur; je le répète, réjouissez-vous. Que votre douceur soit connue de tous les hommes. Le Seigneur est proche.","source":"https://ebible.org/fraLSG/PHP04.htm#V4"},{"id":"rom-15-13","theme":"faith","reference":"Romains 15:13","text":"Que le Dieu de l’espérance vous remplisse de toute joie et de toute paix dans la foi, pour que vous abondiez en espérance, par la puissance du Saint-Esprit!","source":"https://ebible.org/fraLSG/ROM15.htm#V13"}],"labels":{"missing_title":"La collection biblique est manquante","missing_text":"Réimportez le ZIP Daily Bread pour restaurer les passages bibliques."}}}}'
