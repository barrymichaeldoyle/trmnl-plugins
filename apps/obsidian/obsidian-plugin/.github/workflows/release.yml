# Builds main.js from this repository's source when a version tag is pushed,
# attests the release files, and publishes them as the GitHub release
# Obsidian installs from. The tag must match manifest.json's version.
name: Release

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Check the tag matches the manifest
        run: test "$(node -p "require('./manifest.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run build
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            main.js
            manifest.json
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json --title "$GITHUB_REF_NAME" --notes-file release-notes.md
