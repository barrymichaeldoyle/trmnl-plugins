  name: About Obsidian Screens
  description: 'An independent recipe for Obsidian. The free TRMNL Screens plugin for Obsidian reads your vault on your own device and pushes one screen of it to this recipe&#39;s webhook URL, only when that screen changes. Nothing else is sent. Not affiliated with or endorsed by Obsidian.<br><br>Obsidian Screens puts your notes on your TRMNL: today&#39;s daily note tasks grouped by heading, due and overdue tasks from anywhere in your vault, the rows of a Dataview query, an older note resurfaced each day, your writing streak with words written today, or a pinned note such as a weekly plan. Due dates from the Tasks plugin and Dataview are both understood, and links read as plain text.<br><br>Install this recipe once for each screen you want. Then install TRMNL Screens from Obsidian&#39;s Community plugins, paste this recipe&#39;s webhook URL into a screen in its settings, and select Push now. The plugin keeps the screen current by itself, a minute after you stop editing. Full-screen and all three mashup layouts are included, on TRMNL OG and TRMNL X.'
