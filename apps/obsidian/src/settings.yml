  name: About Obsidian Screens
  description: 'An independent TRMNL recipe for Obsidian. The TRMNL Screens plugin for Obsidian reads your vault on your own computer and pushes one screen to this plugin&#39;s webhook URL. Nothing else is sent, and only when the screen changes. Not affiliated with or endorsed by Obsidian.<br><br>Install this recipe once for each screen you want, copy its webhook URL into the TRMNL Screens settings in Obsidian, and pick what it shows: today&#39;s daily note tasks, due and overdue tasks across your vault, the rows of a Dataview query, a note resurfaced from your archive, your writing streak, or a pinned note such as a weekly plan. Full-screen and all three mashup layouts are included.'
